<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity Planner · Hoy (Opción C)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--bg:#F6F3EC;--surface:#fff;--ink:#111;--muted:#5C5951;--line:#E6E2D8;--lime:#C6FF3D;--hot:#C2410C;--flame:#FF6A1A;--blue:#3D5AFE;--pink:#FF4FA3;--yellow:#FFE14D;--cta:#111;--on-cta:#C6FF3D;--shadow:#fff;--hero-ink:#111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E10;--surface:#1A1A1E;--ink:#F4F1EA;--muted:#B4B0A6;--line:#2B2B31;--hot:#FF8A4C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E10;--surface:#1A1A1E;--ink:#F4F1EA;--muted:#B4B0A6;--line:#2B2B31;--hot:#FF8A4C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 "Space Grotesk",system-ui,sans-serif}
.app{max-width:440px;margin:0 auto;padding:18px 18px 130px}
.disp{font-family:"Archivo Black",Impact,system-ui,sans-serif;text-transform:uppercase;letter-spacing:-.01em;line-height:.95}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.date{margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.streak{display:flex;align-items:center;gap:10px;margin:0 0 16px;color:var(--hot);font-weight:700;font-size:15px}
.streak .ic{color:var(--flame);fill:var(--flame);stroke:var(--flame);width:20px;height:20px}
.streak .d{margin-left:auto;display:flex;gap:4px}
.streak .d i{width:8px;height:18px;border-radius:4px;background:var(--line)}
.streak .d i.on{background:var(--flame)}.streak .d i.now{background:transparent;border:2px dashed var(--flame)}
.hero{background:var(--lime);color:#111;border-radius:28px;padding:26px 22px 22px}
.hero h1{font-size:44px;margin:0 0 10px}
.hero p{margin:0 0 22px;font-size:16px;font-weight:600;max-width:26ch}
.cta{width:100%;min-height:64px;border:2px solid #111;border-radius:18px;background:var(--cta);color:var(--on-cta);font-family:"Archivo Black",Impact,sans-serif;font-size:20px;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 #fff;display:flex;align-items:center;justify-content:center;gap:10px}
.cta:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #fff}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px;font-weight:700}
.list{background:var(--surface);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:64px;text-decoration:none;color:var(--ink)}
.row+.row{border-top:1px solid var(--line)}
.row .tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#111}
.row b{display:block;font-size:16px}.row span.s{font-size:13px;color:var(--muted);font-weight:500}
.row>.ic:last-child{margin-left:auto;color:var(--muted);width:18px;height:18px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:22px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav ul{max-width:440px;margin:0 auto;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;gap:2px;align-items:end}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;color:var(--muted);font-size:11px;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.03em}
nav .home a{color:var(--ink);margin-top:-22px}
nav .home .core{width:62px;height:62px;border-radius:20px;background:var(--lime);color:#111;border:2px solid #111;box-shadow:3px 3px 0 #111;display:grid;place-items:center}
:root[data-theme="dark"] nav .home .core{box-shadow:3px 3px 0 var(--lime)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav .home .core{box-shadow:3px 3px 0 #fff}}
nav .home .core .ic{width:28px;height:28px}
</style>
</head>
<body>
<main class="app">
  <p class="date">Jueves · 15 oct</p>
  <p class="streak" role="status"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg><span>10 días · ¡No pierdas la racha!</span>
    <span class="d" role="img" aria-label="Últimos 7 días: 6 con actividad, hoy pendiente"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="now"></i></span></p>

  <section class="hero" aria-label="Entrenamiento de hoy">
    <h1 class="disp">Hoy toca<br>moverse</h1>
    <p>Crea tu entreno y empieza. Dos toques.</p>
    <button class="cta"><svg class="ic" viewBox="0 0 24 24" style="fill:currentColor"><path d="M7 4l13 8-13 8z"/></svg>Crear entreno</button>
  </section>

  <h2>Atajos</h2>
  <div class="list">
    <a class="row" href="#"><span class="tile" style="background:var(--blue);color:#fff"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.6.7-4 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4-3.9 5.6-.7z"/></svg></span><div><b>Rutinas favoritas</b><span class="s">3 guardadas</span></div><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>
    <a class="row" href="#"><span class="tile" style="background:var(--yellow)"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg></span><div><b>Recursos guardados</b><span class="s">5 vídeos</span></div><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>
  </div>
  <p class="note">Prototipo con datos de ejemplo · estado "racha en riesgo".</p>
</main>

<nav aria-label="Navegación principal"><ul>
 <li><a href="#"><svg class="ic" viewBox="0 0 24 24"><path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/></svg>Ejercicios</a></li>
 <li><a href="#"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Rutinas</a></li>
 <li class="home"><a href="#" aria-current="page"><span class="core"><svg class="ic" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg></span>Hoy</a></li>
 <li><a href="#"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>Racha</a></li>
 <li><a href="#"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Perfil</a></li>
</ul></nav>
</body>
</html>
