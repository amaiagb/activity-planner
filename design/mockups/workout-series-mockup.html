<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entreno de hoy · series</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--bg:#F6F3EC;--surface:#fff;--ink:#111;--muted:#5C5951;--line:#E6E2D8;--lime:#C6FF3D;--ls:#F1FFCB;--yl:#FFE14D;--ys:#FFF6C2;--dis:#7D7B72;--core:#111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E10;--surface:#1A1A1E;--ink:#F4F1EA;--muted:#B4B0A6;--line:#2B2B31;--ls:#27330E;--ys:#3A3212;--core:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E10;--surface:#1A1A1E;--ink:#F4F1EA;--muted:#B4B0A6;--line:#2B2B31;--ls:#27330E;--ys:#3A3212;--core:#C6FF3D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 "Space Grotesk",system-ui,sans-serif}
.app{max-width:440px;margin:0 auto;padding:12px 18px 150px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;min-height:48px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);font:700 13px/1.2 "Space Grotesk",sans-serif;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--lime);color:#111}
button:focus-visible{outline:3px solid #3D5AFE;outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:700}
h1{font:400 34px/.98 "Archivo Black",Impact,sans-serif;margin:2px 0 14px}
.pg{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;font-weight:700}
.bar{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);box-shadow:inset 0 0 0 1.5px #111;border-radius:6px;transition:width .2s}
.seg{flex:1;display:flex;gap:4px}
.seg i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.seg i.d{background:var(--lime);box-shadow:inset 0 0 0 1.5px #111}
.seg i.s{background:var(--yl);box-shadow:inset 0 0 0 1.5px #111}
.seg i.c{box-shadow:inset 0 0 0 2px var(--ink)}
.help{display:flex;gap:10px;align-items:flex-start;background:var(--ys);color:var(--ink);border-radius:14px;padding:10px 14px;margin:12px 0 0;font-size:14px;font-weight:500}
.help .ic{margin-top:1px}
.help b{font-weight:700}
.list{background:var(--surface);border-radius:20px;overflow:hidden;margin:14px 0 0;padding:0;list-style:none}
.it+.it{border-top:1px solid var(--line)}
.it.cur{background:var(--ls)}
.r{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 14px;min-height:68px}
.st{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;flex:none;color:transparent}
.it.cur .st{border-color:#111;background:var(--surface)}
.it.d .st{background:var(--lime);border-color:#111;color:#111}
.it.s .st{background:var(--yl);border-color:#111;color:#111}
.nm{flex:1;min-width:0;text-align:left;border:0;background:none;padding:6px 0;color:inherit;font:inherit;cursor:pointer}
.nm b{display:block;font-size:16px;line-height:1.25}
.nm small{font-size:13px;color:var(--muted);font-weight:500}
.it.d .nm b,.it.s .nm b{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.n{background:var(--lime);color:#111}.tag.o{background:var(--yl);color:#111}
.inf,.und{border:0;background:none;color:var(--ink);min-width:44px;min-height:44px;display:grid;place-items:center;cursor:pointer;font:700 13px "Space Grotesk",sans-serif}
.und{text-decoration:underline;text-underline-offset:3px;color:var(--muted);padding:0 8px}
.act{display:flex;align-items:center;gap:8px;padding:0 14px 14px 60px}
.done{flex:1;min-height:50px;border:2px solid #111;border-radius:14px;background:var(--lime);color:#111;font:700 16px "Space Grotesk",sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.skip{min-height:50px;padding:0 16px;border:0;background:none;color:var(--ink);font:700 15px "Space Grotesk",sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.fin{width:100%;min-height:60px;margin-top:20px;border:0;border-radius:18px;background:var(--dis);color:var(--lime);font:400 18px "Archivo Black",Impact,sans-serif;text-transform:uppercase}
.fin.on{background:#111;cursor:pointer}
.sr{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sr b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;list-style:none;margin:0;padding:0}
.chips li{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font:700 16px "Space Grotesk",sans-serif;color:var(--muted)}
.chips li.d{background:var(--lime);border-color:#111;color:#111}
.chips li.c{border-color:var(--ink);color:var(--ink)}
[hidden]{display:none!important}
.ban{display:flex;align-items:center;gap:10px;background:var(--lime);color:#111;border-radius:14px;padding:12px 14px;margin:14px 0 0;font-weight:700;font-size:14px}
.ban button{margin-left:auto;border:0;background:none;color:#111;font:700 14px "Space Grotesk",sans-serif;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 10px;cursor:pointer}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 0;font-weight:500}
.note{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav ul{max-width:440px;margin:0 auto;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;gap:2px;align-items:end}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;color:var(--muted);font-size:11px;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.03em}
nav .home a{color:var(--ink);margin-top:-22px}
nav .home .cr{width:62px;height:62px;border-radius:20px;background:var(--lime);color:#111;border:2px solid #111;box-shadow:3px 3px 0 var(--core);display:grid;place-items:center}
nav .home .cr .ic{width:28px;height:28px}
</style>
</head>
<body>
<main class="app">
  <span class="back"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Hoy</span>
  <h1>Entreno<br>de hoy</h1>
  <div class="sr" id="sr"></div>
  <div class="pg" id="pg"></div>
  <div class="ban" id="ban" role="status" hidden></div>
  <ul class="list" id="ls"></ul>
  <button class="fin" id="fin" aria-disabled="true">Terminar entreno</button>
  <p class="hint" id="hint">Marca algún ejercicio como hecho para poder terminar.</p>
  <p class="note">Mockup interactivo: marca un ejercicio como hecho para activar "Terminar entreno"; resuelve los 5 para pasar a la serie siguiente. Datos de ejemplo.</p>
</main>
<nav aria-label="Navegación principal"><ul>
 <li><a href="#"><svg class="ic" viewBox="0 0 24 24"><path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/></svg>Ejercicios</a></li>
 <li><a href="#"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Rutinas</a></li>
 <li class="home"><a href="#"><span class="cr"><svg class="ic" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg></span>Hoy</a></li>
 <li><a href="#"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>Racha</a></li>
 <li><a href="#"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Perfil</a></li>
</ul></nav>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var X=["Perro Boca Abajo a Zancada Baja","Plancha Alta","Remo con Mancuernas Inclinado","Caminar","Rodilla al Codo desde Perro de Tres Patas"];
var S=X.map(function(){return"p"}),dn=0,open=0,ever=0,ban="";
var CK='<svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M5 12l5 5 9-10"/></svg>',SKI='<svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M6 12h12"/></svg>',INF='<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';
function nextP(){return S.indexOf("p")}
function go(fn){ban="";fn();
 if(nextP()<0&&S.indexOf("d")>-1){ever+=S.filter(function(x){return x==="d"}).length;dn++;ban="Serie "+dn+" completada. Empieza la serie "+(dn+1)+".";S=X.map(function(){return"p"})}
 open=nextP();render()}
function render(){
 var cur=nextP(),res=S.filter(function(s){return s!=="p"}).length,tot=Math.max(3,dn+1),c="";
 for(var i=0;i<tot;i++)c+='<li class="'+(i<dn?"d":i===dn?"c":"")+'"'+(i===dn?' aria-current="step"':'')+' aria-label="Serie '+(i+1)+(i<dn?', completada':i===dn?', en curso':'')+'">'+(i<dn?CK:(i+1))+'</li>';
 $("sr").innerHTML='<b>Series</b><ol class="chips">'+c+'</ol>';
 $("pg").innerHTML='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+S.length+'" aria-valuenow="'+res+'"><i style="width:'+(res/S.length*100)+'%"></i></div><span>'+res+' de '+S.length+'</span>';
 var b=$("ban");b.hidden=!ban;b.textContent=ban;
 var any=ever>0||S.indexOf("d")>-1,f=$("fin");f.className="fin"+(any?" on":"");f.setAttribute("aria-disabled",!any);$("hint").hidden=any;
 $("ls").innerHTML=X.map(function(n,i){
  var s=S[i],isCur=i===cur,ex=i===open&&s==="p";
  var tag=s==="s"?'<span class="tag o">Omitido</span>':(isCur?'<span class="tag n">Ahora</span>':'');
  var right=s==="p"?'<button class="inf" aria-label="Ver ejercicio: '+n+'">'+INF+'</button>':'<button class="und" data-u="'+i+'" aria-label="Deshacer: '+n+'">Deshacer</button>';
  return '<li class="it '+s+(isCur?' cur':'')+'"><div class="r"><span class="st">'+(s==="s"?SKI:CK)+'</span><button class="nm" data-o="'+i+'" '+(s==="p"?'aria-expanded="'+ex+'"':'disabled')+'><b>'+n+'</b><small>8–12 repeticiones'+tag+'</small></button>'+right+'</div>'
   +(ex?'<div class="act"><button class="done" data-d="'+i+'">'+CK+'Hecho</button><button class="skip" data-k="'+i+'">Omitir</button></div>':'')+'</li>'}).join("")}
document.querySelector(".app").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
 if(d.d!==undefined)go(function(){S[+d.d]="d"});
 else if(d.k!==undefined)go(function(){S[+d.k]="s"});
 else if(d.u!==undefined)go(function(){S[+d.u]="p"});
 else if(d.o!==undefined){open=+d.o;render()}});
open=0;render();
})();
</script>
</body>
</html>
