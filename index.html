<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f4" />
    <meta name="description" content="A personal fitness planner that makes it easier to decide what to do today." />
    <link rel="icon" type="image/svg+xml" href="/icons/fitness.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fitness Planner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Personal Fitness Planner</title>
  </head>
  <body>
    <script>
      try {
        const language = localStorage.getItem('activity-planner.language')
        const theme = localStorage.getItem('activity-planner.theme')
        document.documentElement.lang = language === 'en' || language === 'es' ? language : (navigator.language.toLowerCase().startsWith('es') ? 'es' : 'en')
        if (theme === 'light' || theme === 'dark' || theme === 'system') document.documentElement.dataset.theme = theme
      } catch { /* Storage can be unavailable in private browsing. */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
